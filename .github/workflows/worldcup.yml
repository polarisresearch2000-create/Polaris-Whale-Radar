name: Polaris World Cup Radar

# 长任务版(解决 GitHub 免费 cron 不可靠导致的多小时静默):
# 一次运行连续约 5h40m, 期间每小时跑一轮 --once 并回写状态; cron 每小时尝试重启,
# 靠并发锁(同时只一个)接力 → 近乎不间断, 每小时推一次。公开仓库 Actions 免费无限。
on:
  schedule:
    - cron: "9 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: worldcup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run World Cup radar (hourly for ~6h)
        env:
          SPORTS_BOT_TOKEN: ${{ secrets.SPORTS_BOT_TOKEN }}
          SPORTS_CHANNEL: "@polarisresearch2000_PE"
          PROFILE: SPORTS
          POLY_TAG: fifa-world-cup
          VERTICAL_LABEL: World Cup
          MIN_NOTIONAL: "5000"
          SIGNAL_MIN_PNL: "20000"
          WATCHLIST_MIN_PNL: "50000"
          WATCHLIST_MIN_NOTIONAL: "500"
          POSITIONING_MIN_NOTIONAL: "500"
          POSITIONING_MIN: "55"
          PROFILES_ENABLED: "off"
          SIGNALS_ENABLED: "off"
        run: |
          git config user.name "polaris-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$((SECONDS + 18000))   # ~5h: 跑5轮(每小时一轮)后干净退出, 远在 6h 上限内, cron 再接力
          while [ $SECONDS -lt $END ]; do
            timeout 600 node bot.js --once || true
            if [ -n "$(git status --porcelain data)" ]; then
              git add data
              git commit -m "chore: update worldcup state [skip ci]" || true
              git pull --rebase --autostash origin main || true
              git push || true
            fi
            echo "--- iteration done at ${SECONDS}s, sleeping 1h ---"
            sleep 3600
          done
